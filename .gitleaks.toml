title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
# Security: Do NOT exclude security-sensitive source files from scanning (#63)
# Only exclude test fixtures, build artifacts, and specific test files with known
# false positives (test credentials, mock tokens). Other test files are scanned
# normally to catch accidental secret leaks. (ADV-07)
paths = [
  '''testdata''',
  '''tests/.*''',
  '''\.zig-cache''',
  '''zig-out''',
  '''vendor''',
  '''src/encrypted_secrets_test\.zig$''',
  '''src/remote_test\.zig$''',
]
stopwords = [
  "super-secret-password",
  "encrypted_secrets",
  "SecretProvider",
  "SecretRef",
  "readFromFile",
  "readFromStdin",
  "abc123def456",
]
