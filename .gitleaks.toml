title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
# Security: Do NOT exclude security-sensitive source files from scanning (#63)
# Only exclude test fixtures and build artifacts
paths = [
  '''testdata''',
  '''tests/.*''',
  '''\.zig-cache''',
  '''zig-out''',
  '''vendor''',
  '''.*_test\.zig$''',
  '''.*test_.*\.zig$''',
]
stopwords = [
  "super-secret-password",
  "encrypted_secrets",
  "SecretProvider",
  "SecretRef",
  "readFromFile",
  "readFromStdin",
  "abc123def456",
]
